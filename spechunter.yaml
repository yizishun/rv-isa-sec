# spechunter.yaml — specHunter 顶层配置
# 此文件是 target 定义的唯一权威来源。
# CLI、分发层、shell 脚本均从此读取。

spec_hunter:
  # 全局默认值 — 可被单个 target 覆盖
  model: "sonnet"
  max_turns: 20
  allowed_tools: ["Read", "Bash", "Grep", "Glob", "Write", "Edit", "WebSearch", "WebFetch", "Task", "TodoWrite"]

  # 各 phase 默认超时 (秒)
  timeouts:
    phase0: 300
    phase1: 600
    phase2: 900
    phase3: 900

  # 启用的 target 列表
  # 要新增一个 target: 在此添加条目 + 创建 spechunter/prompts/{label}.yml
  targets:
    - label: "linux"
      enabled: true
      path: "~/riscv/linux"
      description: "Linux kernel RISC-V port"

    - label: "opensbi"
      enabled: true
      path: "~/riscv/opensbi"
      description: "OpenSBI — RISC-V SBI reference firmware"

    - label: "freebsd-src"
      enabled: true
      path: "~/riscv/freebsd-src"
      description: "FreeBSD kernel RISC-V port"

    - label: "qemu"
      enabled: true
      path: "~/riscv/qemu"
      description: "QEMU — RISC-V system emulator (target/riscv/)"

    - label: "xiangshan"
      enabled: true
      path: "~/riscv/XiangShan"
      description: "XiangShan — open-source high-performance RISC-V processor"

  # prompt 文件目录 — 每个 enabled target 必须有对应的 {label}.yml
  prompts_dir: "spechunter/prompts"
