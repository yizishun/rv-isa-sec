name: Daily Scan Report

on:
  schedule:
    - cron: '42 14 * * *' #TODO: it does not work for no reason
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  report:
    runs-on: self-hosted
    env:
      GIT_AUTHOR_NAME: "github-actions[bot]"
      GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      GIT_COMMITTER_NAME: "github-actions[bot]"
      GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    steps:
      - name: Run analysis
        working-directory: /home/yzs/riscv/rv-isa-sec
        run: bash scripts/daily-analyze.sh

      - name: Commit output + report
        working-directory: /home/yzs/riscv/rv-isa-sec
        run: |
          TODAY=$(date +%F)
          REPORT="reports/${TODAY}.md"

          # stage output + spec markers + logs + report
          git add output/
          git add 'spec/*/pr-*/.spechunter_*' 'spec/*/pr-*/logs/' 2>/dev/null || true
          if [ -f "$REPORT" ]; then
            git add "$REPORT"
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "daily: scan report for ${TODAY}" \
                     -m "Co-Authored-By: Claude (via Claude Code) <noreply@anthropic.com>"

          echo "Committed successfully."
